[package]
name = "rustev-cli"
version.workspace = true
description = "Rustev's command-line host: plan check, compile and show; rules-backed runs with bounded capture; offline replay, evaluation, gates and calibration fitting."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rustev-cli"
readme.workspace = true
keywords = ["decision-engine", "cli"]
categories = ["command-line-utilities"]
# Spec 021, 3.4: the intended public registry only.
publish = ["crates-io"]
# Spec 021, 3.5: the archive holds the library source and the files its
# unit tests or public API embed; the reviewed file list
# is tools/rustev-release/archive-policy.json.
# A file a source embeds but the archive lacks fails the unpacked build of
# 3.7 (`include_bytes!` is a compile error), so a gap is never silent.
include = ["/src/**/*.rs", "/tests/golden/support.record.json", "/LICENSE"]

[package.metadata.spec-spine]
spec = "006-cli-surface"

[[bin]]
name = "rustev"
path = "src/main.rs"

# The library crates, the rules backend and Tokio; no HTTP stack, no
# ecosystem crate and no argument-parsing crate (spec 006, 2).
[dependencies]
rustev-contract.workspace = true
rustev-core = { workspace = true, features = ["parameterized"] }
rustev-runtime.workspace = true
rustev-eval = { workspace = true, features = ["parameterized"] }
rustev-surface = { workspace = true, features = ["parameterized"] }
rustev-backend-rules.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "signal"] }

# `O_NONBLOCK` and `O_NOFOLLOW` for opening inputs (spec 006, 3.3.1).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
