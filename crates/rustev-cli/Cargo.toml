[package]
name = "rustev-cli"
version.workspace = true
description = "Rustev's command-line host: plan check, compile and show; rules-backed runs with bounded capture; offline replay, evaluation, gates and calibration fitting."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rustev-cli"
readme.workspace = true
keywords = ["decision-engine", "cli"]
categories = ["command-line-utilities"]
# Spec 021, 3.4: the intended public registry only.
publish = ["crates-io"]

[package.metadata.spec-spine]
spec = "006-cli-surface"

[[bin]]
name = "rustev"
path = "src/main.rs"

# The library crates, the rules backend and Tokio; no HTTP stack, no
# ecosystem crate and no argument-parsing crate (spec 006, 2).
[dependencies]
rustev-contract.workspace = true
rustev-core.workspace = true
rustev-runtime.workspace = true
rustev-eval.workspace = true
rustev-backend-rules.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "signal"] }

# `O_NONBLOCK` and `O_NOFOLLOW` for opening inputs (spec 006, 3.3.1).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
