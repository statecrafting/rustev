[package]
name = "rustev-runtime"
version.workspace = true
description = "Rustev's runtime: bounded execution of compiled plans through backend seams, with honest cost, cancellation and evidence."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rustev-runtime"
readme.workspace = true
keywords = ["decision-engine", "runtime", "evidence"]
categories = ["asynchronous"]
# Spec 021, 3.4: the intended public registry only.
publish = ["crates-io"]

[package.metadata.spec-spine]
spec = "003-runtime-execution-and-evidence"

[dependencies]
rustev-contract.workspace = true
rustev-core.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt"] }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }

[lints]
workspace = true
