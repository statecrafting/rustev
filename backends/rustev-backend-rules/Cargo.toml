[package]
name = "rustev-backend-rules"
version.workspace = true
description = "Rustev's deterministic rules backend: an identified, bounded rules program answering semantic requests with authored logits."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rustev-backend-rules"
readme.workspace = true
keywords = ["decision-engine", "rules", "backend"]
categories = ["algorithms"]
# Spec 021, 3.4: the intended public registry only.
publish = ["crates-io"]
# Spec 021, 3.5: the archive holds the library source; the reviewed file list
# is tools/rustev-release/archive-policy.json.
include = ["/src/**/*.rs", "/LICENSE"]

[package.metadata.spec-spine]
spec = "005-reference-backends"

[dependencies]
rustev-contract.workspace = true
rustev-core = { workspace = true, features = ["parameterized"] }
serde.workspace = true
serde_json.workspace = true

# The runtime and Tokio are for integration tests only (spec 005, 3.15).
[dev-dependencies]
rustev-runtime.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }

[lints]
workspace = true
