[package]
name = "rustev-backend-embed-linear"
version.workspace = true
description = "Rustev's local semantic backend: a frozen sentence encoder and identified linear heads answering closed-set requests with logits."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
# Not in the release family until spec 031 admits it (spec 011, 3.17.4).
publish = false

[package.metadata.spec-spine]
spec = "011-semantic-backend"

[features]
# The deterministic, dependency-free synthetic encoder (spec 011, 3.19).
synthetic = []

# No inference dependency enters before the feasibility gate passes stages
# 1 to 3 for a platform (spec 011, 3.2.3).
[dependencies]
rustev-contract.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
rustev-backend-embed-linear = { path = ".", features = ["synthetic"] }

[lints]
workspace = true
