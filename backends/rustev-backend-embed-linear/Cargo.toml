[package]
name = "rustev-backend-embed-linear"
version.workspace = true
description = "Rustev's local semantic backend: a frozen sentence encoder and identified linear heads answering closed-set requests with logits."
edition.workspace = true
# ort 2.0.0-rc.15 needs 1.92; this crate is outside the release family (3.17.4).
rust-version = "1.92"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
# Not in the release family until spec 031 admits it (spec 011, 3.17.4).
publish = false
# examples/feasibility.rs is the stage 2 to 4 probe, bound by SHA-256 in
# qualification/feasibility.json (macOS 2026-10-22, Linux 2026-11-02). It reads
# the runtime version through dlopen, which the workspace's
# `unsafe_code = "forbid"` refuses, so it is kept as evidence and not built.
autoexamples = false

[package.metadata.spec-spine]
spec = "011-semantic-backend"

[features]
# The deterministic, dependency-free synthetic encoder (spec 011, 3.19).
synthetic = []

# The inference dependencies entered once the feasibility record passed
# stages 1 to 3 for macos-aarch64 (spec 011, 3.2.3; A-73).
[dependencies]
rustev-contract.workspace = true
rustev-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# No default features: dynamic loading only; nothing downloads or links
# (spec 011, 3.6.1 and 3.18.2(c)).
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"] }
tokenizers = { version = "=1.0.0-rc.3", default-features = false, features = ["serialize", "normalizers", "wordpiece", "regex"] }

[dev-dependencies]
rustev-backend-embed-linear = { path = ".", features = ["synthetic"] }

[lints]
workspace = true
