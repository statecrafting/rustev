# Spec 056 3.3: the fresh-consumer qualification of a published family
# version. Dispatched after publication with the release tag; it runs
# tools/rustev-release/qualify.sh on each platform of the release set's CLI
# and npm matrix and uploads that platform's step files. Recording the
# lifecycle as `qualified` is `rustev-release qualify` over the collected
# evidence, never this workflow. Not a required check (spec 056 3.3).
name: qualify

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The published release tag, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: read
  attestations: read

concurrency:
  group: qualify-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  qualify:
    name: qualify ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # The platforms and runners of release.yml (spec 027 3.13.1). The
        # musl platforms run the harness in an Alpine container on the host,
        # so its libc is the platform's.
        include:
          - { platform: linux-x64-gnu, runner: ubuntu-24.04 }
          - { platform: linux-arm64-gnu, runner: ubuntu-24.04-arm }
          - { platform: linux-x64-musl, runner: ubuntu-24.04, alpine: true }
          - { platform: linux-arm64-musl, runner: ubuntu-24.04-arm, alpine: true }
          - { platform: darwin-arm64, runner: macos-15 }
          - { platform: darwin-x64, runner: macos-15-intel }
          - { platform: win32-x64-msvc, runner: windows-2025 }
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: The tag is a stable release tag, checked before any checkout
        run: |
          printf '%s\n' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            || { echo "qualify: tag must be v<major>.<minor>.<patch>" >&2; exit 2; }
      - name: Check out committed bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: The signed manifest of the hosted release
        id: release
        run: |
          gh release download "$TAG" -p release-manifest.json -p release-manifest.json.sig -D release
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "pinned=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
          # The MSRV comes from the workspace at the tag, never the manifest:
          # the manifest's signature is verified only inside qualify.sh, which
          # then requires the manifest's msrv to be one of these toolchains.
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          [ -n "$msrv" ] || { echo "qualify: Cargo.toml at $TAG declares no rust-version" >&2; exit 1; }
          case "$msrv" in *.*.*) ;; *) msrv="$msrv.0" ;; esac
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ !matrix.alpine }}
        with:
          node-version: 22
      - name: The pinned and MSRV toolchains (the harness installs none)
        if: ${{ !matrix.alpine }}
        env:
          PINNED: ${{ steps.release.outputs.pinned }}
          MSRV: ${{ steps.release.outputs.msrv }}
        run: rustup toolchain install "$PINNED" "$MSRV" --profile minimal
      - name: python3 on Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          command -v python3 >/dev/null && exit 0
          mkdir -p "$RUNNER_TEMP/shim"
          printf '#!/bin/sh\nexec python "$@"\n' > "$RUNNER_TEMP/shim/python3"
          chmod +x "$RUNNER_TEMP/shim/python3"
          echo "$RUNNER_TEMP/shim" >> "$GITHUB_PATH"
      - name: Qualify (056 3.3)
        if: ${{ !matrix.alpine }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: sh tools/rustev-release/qualify.sh "$VERSION" release/release-manifest.json evidence
      - name: Qualify in Alpine (056 3.3)
        if: ${{ matrix.alpine }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PINNED: ${{ steps.release.outputs.pinned }}
          MSRV: ${{ steps.release.outputs.msrv }}
          # alpine:3.22, pinned by its multi-platform index digest.
          ALPINE: alpine@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
        run: |
          docker run --rm -e GH_TOKEN -e VERSION -e PINNED -e MSRV \
            -v "$PWD:/repo" -w /repo "$ALPINE" sh -euc '
              apk add --no-cache bash build-base curl git github-cli nodejs npm openssh-keygen python3 rustup
              rustup-init -y --no-modify-path --default-toolchain none
              . "$HOME/.cargo/env"
              rustup toolchain install "$PINNED" "$MSRV" --profile minimal
              git config --global --add safe.directory /repo
              sh tools/rustev-release/qualify.sh "$VERSION" release/release-manifest.json evidence'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: qualify-${{ matrix.platform }}
          path: evidence
          if-no-files-found: error
