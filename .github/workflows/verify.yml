# Every approved spec's declared acceptance (`make verify`, `spec-spine
# verify`), a reusable workflow that ci-gate calls and requires
# (ci.extra_required_jobs). Whole specs run in isolated groups.
# A pull request's own run checks the partition only; the merge queue entry,
# which tests the change against the latest main, and every push to main run
# every group. The label `statecraft:stacked-ci` runs them on a pull request.
# Not rendered by the setup profile: owned by spec 001.
name: verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.partition.outputs.matrix }}
      run: ${{ steps.partition.outputs.run }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Test acceptance partition controls
        run: python3 -m unittest discover -s scripts/acceptance -p 'test_*.py'
      - name: Check complete coverage and plan groups
        id: partition
        env:
          EVENT: ${{ github.event_name }}
          STACKED_CI: ${{ contains(github.event.pull_request.labels.*.name, 'statecraft:stacked-ci') }}
        run: |
          matrix=$(python3 scripts/acceptance/verify.py --matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = pull_request ] && [ "$STACKED_CI" != true ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Declared acceptance runs in the merge queue for this pull request." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  acceptance:
    name: acceptance (${{ matrix.group }})
    needs: plan
    if: needs.plan.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    # Line tables keep file:line in panics at a fraction of full debuginfo.
    # Incremental compilation stays on: the mutation seeds rebuild after a
    # one-line edit each, and turning it off cost about 25% per seed (31.5 s
    # to 38 s median over 40 seeds). Its artifacts are kept out of the cache.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    # The runtime tests use a manual clock and never sleep on wall time, so a
    # hang is a defect; fail it instead of waiting for the platform limit.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      # The managed preflight job, which gates this one, saves the pinned
      # binary under this key on every ref; restoring it here avoids four
      # jobs racing to save their own copy and a 2-minute install on a miss.
      - name: Read the spec-spine pin
        id: pin
        run: sh scripts/statecraft/gate.sh pin >> "$GITHUB_OUTPUT"
      - name: Restore the pinned spec-spine
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bin/spec-spine
          key: spec-spine-${{ steps.pin.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install the pinned spec-spine
        run: |
          if test -x .bin/spec-spine && .bin/spec-spine --version; then
            :
          else
            make tools
          fi
      # Restored everywhere, saved only from main: per-pull-request saves of
      # several gigabytes evicted main's entries (10 GB repository limit), so
      # pull requests restored nothing and paid one to four minutes to save.
      - name: Restore cargo registry, git and target
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/debug/incremental
          key: verify-${{ matrix.group }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            verify-${{ matrix.group }}-${{ runner.os }}-
      - name: Declared acceptance
        env:
          ACCEPTANCE_GROUP: ${{ matrix.group }}
        run: python3 scripts/acceptance/verify.py "$ACCEPTANCE_GROUP"
      # Cargo fingerprints workspace sources by mtime, which a fresh checkout
      # resets, so workspace crates always rebuild: their artifacts are dead
      # weight in the cache. Only dependencies are kept.
      - name: Drop workspace artifacts before saving (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        run: cargo metadata --format-version 1 --no-deps | jq -r '.packages[].name' | sed 's/^/-p /' | xargs -r cargo clean
      - name: Save cargo registry, git and target (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/debug/incremental
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  verify:
    name: verify
    if: always()
    needs: [plan, acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every acceptance group
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RUN: ${{ needs.plan.outputs.run }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
        # Skipped is accepted only when the plan chose not to run the groups.
        run: |
          test "$PLAN_RESULT" = success
          if [ "$RUN" = false ]; then
            test "$ACCEPTANCE_RESULT" = skipped
          else
            test "$ACCEPTANCE_RESULT" = success
          fi
