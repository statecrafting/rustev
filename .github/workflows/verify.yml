# Every approved spec's declared acceptance (`make verify`, `spec-spine
# verify`), a reusable workflow that ci-gate calls and requires
# (ci.extra_required_jobs). Whole specs run in four isolated groups.
# Not rendered by the setup profile: owned by spec 001.
name: verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.partition.outputs.matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Test acceptance partition controls
        run: python3 -m unittest discover -s scripts/acceptance -p 'test_*.py'
      - name: Check complete coverage and plan groups
        id: partition
        run: |
          matrix=$(python3 scripts/acceptance/verify.py --matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  acceptance:
    name: acceptance (${{ matrix.group }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    # Incremental artifacts never help a fresh runner and bloat the cache; line
    # tables keep file:line in panics at a fraction of full debuginfo.
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    # The runtime tests use a manual clock and never sleep on wall time, so a
    # hang is a defect; fail it instead of waiting for the platform limit.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Cache the pinned spec-spine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bin
          key: spec-spine-${{ runner.os }}-${{ hashFiles('spec-spine.toml') }}
      - name: Install the pinned spec-spine
        run: |
          if test -x .bin/spec-spine && .bin/spec-spine --version; then
            :
          else
            make tools
          fi
      # Restored everywhere, saved only from main: per-pull-request saves of
      # several gigabytes evicted main's entries (10 GB repository limit), so
      # pull requests restored nothing and paid one to four minutes to save.
      - name: Restore cargo registry, git and target
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: verify-${{ matrix.group }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            verify-${{ matrix.group }}-${{ runner.os }}-
      - name: Declared acceptance
        env:
          ACCEPTANCE_GROUP: ${{ matrix.group }}
        run: python3 scripts/acceptance/verify.py "$ACCEPTANCE_GROUP"
      - name: Save cargo registry, git and target (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  verify:
    name: verify
    if: always()
    needs: [plan, acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every acceptance group
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
        run: test "$PLAN_RESULT" = success && test "$ACCEPTANCE_RESULT" = success
