# Every approved spec's declared acceptance (`make verify`, `spec-spine
# verify`), a reusable workflow that ci-gate calls and requires
# (ci.extra_required_jobs). It runs 20+ minutes, so it is its own job.
# Not rendered by the setup profile: owned by spec 001.
name: verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    # The runtime tests use a manual clock and never sleep on wall time, so a
    # hang is a defect; fail it instead of waiting for the platform limit.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Cache the pinned spec-spine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tooling
          key: spec-spine-${{ runner.os }}-${{ hashFiles('spec-spine.toml') }}
      - name: Install the pinned spec-spine
        run: test -x .tooling/bin/spec-spine && .tooling/bin/spec-spine --version || make tools
      - name: Cache cargo registry, git and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: verify-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            verify-${{ runner.os }}-
      - name: Declared acceptance
        run: make verify
