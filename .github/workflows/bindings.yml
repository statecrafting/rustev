# The Node-API and WebAssembly bindings of spec 027 (3.10 to 3.13), a
# reusable workflow that ci-gate calls and requires (ci.extra_required_jobs).
# Not rendered by the setup profile: owned by spec 027, as boundaries.yml is
# owned by spec 001.
#
# - `wasm`: `make bindings` on the reference runner (ubuntu-24.04 x64,
#   Node 22): the WebAssembly package, its type drift checks, import
#   allowlist and budgets (Node and headless Chromium), the conformance
#   suite in Node and Chromium, the differential corpus natively, in Node
#   and in Chromium, and the native package on this runner. The measurement
#   document and corpus results are uploaded.
# - `node-versions`: the native suite on linux-x64-gnu under Node 20 and 24
#   (Node 22 runs in `wasm`).
# - `native`: each of the seven platforms of 3.13.1 builds its addon,
#   runs the corpus, stages the addon into its platform package, installs
#   both packages into a fresh project from their tarballs and runs the
#   native conformance suite there on Node 22 (load, compile, decide with
#   the rules backend, replay). The addon is uploaded.
name: bindings

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  wasm:
    name: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Restored everywhere, saved only from main (as in verify.yml): saves
      # from pull requests and merge-queue branches, which nothing else can
      # read, evicted main's entries from the 10 GB repository limit.
      - name: Restore cargo registry, git, target and the pinned WebAssembly tools
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/wasm-tools
            target
          # The tool pins are in the key, and each tool lives under a root named
          # by its version, so a restored older cache never supplies a stale tool.
          key: bindings-wasm-${{ runner.os }}-wasm-bindgen-0.2.129-wasm-opt-0.116.1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            bindings-wasm-${{ runner.os }}-
      - name: Install the pinned WebAssembly tools (027 3.10.2)
        run: |
          rustup target add wasm32-unknown-unknown
          test -x ~/wasm-tools/wasm-bindgen-0.2.129/bin/wasm-bindgen || cargo install --locked --root ~/wasm-tools/wasm-bindgen-0.2.129 wasm-bindgen-cli --version 0.2.129
          test -x ~/wasm-tools/wasm-opt-0.116.1/bin/wasm-opt || cargo install --locked --root ~/wasm-tools/wasm-opt-0.116.1 wasm-opt --version 0.116.1
          echo "$HOME/wasm-tools/wasm-bindgen-0.2.129/bin" >> "$GITHUB_PATH"
          echo "$HOME/wasm-tools/wasm-opt-0.116.1/bin" >> "$GITHUB_PATH"
      - name: Install the JavaScript tooling and headless Chromium's system libraries
        working-directory: tools/rustev-conformance/js
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          sudo node_modules/.bin/playwright-core install-deps chromium-headless-shell
      - name: Bindings (make bindings)
        run: make bindings
      # Cargo fingerprints workspace sources by mtime, which a fresh checkout
      # resets, so workspace crates always rebuild: their artifacts are dead
      # weight in the cache. Only dependencies are kept.
      - name: Drop workspace artifacts before saving (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        run: cargo metadata --format-version 1 --no-deps | jq -r '.packages[].name' | sed 's/^/-p /' | xargs -r cargo clean
      - name: Save the cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/wasm-tools
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Upload the measurement document and corpus results (027 3.10.6, 3.11.3)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-measurement
          path: |
            target/bindings/wasm-measurement.json
            target/bindings/chromium-time.json
            target/bindings/fp-corpus-node.json
            target/bindings/fp-corpus-chromium.json
          if-no-files-found: warn

  node-versions:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # Restored everywhere, saved only from main (as in verify.yml): saves
      # from pull requests and merge-queue branches, which nothing else can
      # read, evicted main's entries from the 10 GB repository limit.
      - name: Restore cargo registry, git and target
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bindings-node-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            bindings-node-${{ runner.os }}-
      - name: Native suite on Node ${{ matrix.node }} (027 3.13.1)
        run: |
          cargo build -p rustev-node --locked --release
          node tools/rustev-conformance/js/copy-addon.mjs target integrations/rustev-node
          node --test integrations/rustev-node/test/*.test.mjs
          node tools/rustev-conformance/js/run.mjs native integrations/rustev-node
      # Cargo fingerprints workspace sources by mtime, which a fresh checkout
      # resets, so workspace crates always rebuild: their artifacts are dead
      # weight in the cache. Only dependencies are kept.
      - name: Drop workspace artifacts before saving (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        run: cargo metadata --format-version 1 --no-deps | jq -r '.packages[].name' | sed 's/^/-p /' | xargs -r cargo clean
      - name: Save the cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  native:
    name: native ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc: built in Debian bookworm (glibc 2.36) so the addon loads on
          # older distributions than the runner's; tested on the runner.
          - { platform: linux-x64-gnu, runner: ubuntu-24.04, image: "rust:1.98.1-bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e" }
          - { platform: linux-arm64-gnu, runner: ubuntu-24.04-arm, image: "rust:1.98.1-bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e" }
          # musl: built and tested in Alpine 3.22 (its Node 22), the recorded
          # emulation of 3.13.1 for the musl targets.
          - { platform: linux-x64-musl, runner: ubuntu-24.04, image: "rust:1.98.1-alpine3.22@sha256:a1796ca6fa216d6727b5f61c69e4c665b120b1a4dcb969639e2f25f1ed309456" }
          - { platform: linux-arm64-musl, runner: ubuntu-24.04-arm, image: "rust:1.98.1-alpine3.22@sha256:a1796ca6fa216d6727b5f61c69e4c665b120b1a4dcb969639e2f25f1ed309456" }
          - { platform: darwin-arm64, runner: macos-15 }
          # A native x64 macOS runner, so no Rosetta emulation is needed.
          - { platform: darwin-x64, runner: macos-15-intel }
          - { platform: win32-x64-msvc, runner: windows-2025 }
    defaults:
      run:
        shell: bash
    steps:
      # The conformance fixtures and goldens are pinned by their bytes, and
      # the Windows runner's Git defaults to core.autocrlf=true, which would
      # rewrite their line endings on checkout.
      - name: Check out committed bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ !endsWith(matrix.platform, '-musl') }}
        with:
          node-version: 22
      - name: Build the addon and run the corpus in Debian bookworm
        if: endsWith(matrix.platform, '-gnu')
        run: |
          docker run --rm -v "$PWD":/w -w /w "${{ matrix.image }}" sh -euc '
            cargo build -p rustev-node --locked --release
            cargo run -p rustev-fp-corpus --locked --release -- check tools/rustev-conformance/fp-corpus/expected.json
          '
          sudo chown -R "$(id -u):$(id -g)" target
      - name: Build and test in Alpine (musl)
        if: endsWith(matrix.platform, '-musl')
        run: |
          docker run --rm -v "$PWD":/w -w /w -e RUSTFLAGS="-C target-feature=-crt-static" "${{ matrix.image }}" sh -euc '
            apk add --no-cache nodejs npm
            node --version
            cargo build -p rustev-node --locked --release
            cargo run -p rustev-fp-corpus --locked --release -- check tools/rustev-conformance/fp-corpus/expected.json
            test "$(node -p "process.platform+\"-\"+process.arch")-musl" = "${{ matrix.platform }}"
            node tools/rustev-conformance/js/platform-packages.mjs check
            node tools/rustev-conformance/js/platform-packages.mjs stage target
            node tools/rustev-conformance/js/platform-packages.mjs fresh target/native-fresh > target/native-fresh.path
            node tools/rustev-conformance/js/run.mjs native "$(cat target/native-fresh.path)"
          '
          sudo chown -R "$(id -u):$(id -g)" target integrations/rustev-node/npm
      - name: Build the addon and run the corpus
        if: startsWith(matrix.platform, 'darwin') || startsWith(matrix.platform, 'win32')
        run: |
          cargo build -p rustev-node --locked --release
          cargo run -p rustev-fp-corpus --locked --release -- check tools/rustev-conformance/fp-corpus/expected.json
      - name: Smoke test from a fresh install on Node 22 (027 3.13.1, 3.13.2)
        if: ${{ !endsWith(matrix.platform, '-musl') }}
        run: |
          node tools/rustev-conformance/js/platform-packages.mjs check
          node tools/rustev-conformance/js/platform-packages.mjs stage target
          test -f "integrations/rustev-node/npm/${{ matrix.platform }}/rustev.${{ matrix.platform }}.node"
          node tools/rustev-conformance/js/platform-packages.mjs fresh target/native-fresh > target/native-fresh.path
          node tools/rustev-conformance/js/run.mjs native "$(cat target/native-fresh.path)"
      - name: Upload the prebuilt addon
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustev-${{ matrix.platform }}
          path: integrations/rustev-node/npm/${{ matrix.platform }}/rustev.${{ matrix.platform }}.node
          if-no-files-found: error
