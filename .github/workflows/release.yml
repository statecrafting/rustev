# The release workflow of spec 031 (3.9, 3.12): builds the release's npm
# tarballs and prebuilt CLI binaries from the owner's signed tag, builds
# each of them a second time on independent runners and requires identical
# bytes (3.9.3), writes a CycloneDX SBOM per artifact (3.9.1), audits what
# they contain (3.9.2), and gives each release artifact a keyless signature
# with an in-toto SLSA build provenance attestation bound to this workflow,
# the commit and the tag (3.9.5, SLSA v1.0 Build Level 2). Not rendered by
# the setup profile: owned by spec 031. It is not a required job of ci-gate.
#
# It runs only when dispatched by hand. A release run names the tag and is
# dispatched on it (`gh workflow run release.yml --ref vX.Y.Z -f
# tag=vX.Y.Z`); by default it builds, checks, attests and uploads the
# artifacts, and publishes nothing. The `npm` job publishes, with npm
# provenance (3.9.6), only when dispatched with `publish-npm: true` and only
# after the owner approves the `npm-publish` Environment: publication is the
# owner's act under 031 3.11 and spec 021 3.9. It uses npm trusted
# publishing (OIDC); no registry token is stored or read here. Crates are
# uploaded by `rustev-release publish` (spec 021), never by this workflow.
#
# A rehearsal (`gh workflow run release.yml --ref <branch> -f
# rehearsal=true`) runs every build and check at the dispatched commit
# without a tag: it attests nothing, never runs the `npm` job, and refuses
# `publish-npm` (031 3.11). It is evidence for that commit only.
#
# - `tag`: the dispatched tag is the release-set file's tag, signed and
#   verified against `tools/rustev-release/allowed_signers`, and the
#   checkout is that tag's commit (a rehearsal: the dispatched commit).
# - `bindings`: spec 027's bindings workflow at that commit (every test, the
#   budgets and the corpus), which uploads each platform's addon.
# - `cli`: the `rustev` binary per platform of 027 3.13.1, smoke tested
#   (help, and a reference plan check equal to its golden).
# - `rebuild`: the second, independent build of each platform's binary and
#   addon, on its own runners, in the same images and environments (3.9.3).
# - `archive`: both builds' binaries archived with GNU tar in a fixed
#   order, owner and time (3.9.3); the release's archives attested.
# - `pack`: the nine npm tarballs, packed once from bindings' addons (the
#   release, attested) and once from the rebuild's (3.9.3), each
#   `package.json` with exactly its `private` guard removed (spec 027 keeps
#   it until publication), checked by `rustev-release manifests` first.
# - `reproducibility`: the two builds' binaries, addons, archives and
#   tarballs compared byte for byte; any difference fails (3.9.3).
# - `sbom`: a CycloneDX 1.5 SBOM per archive and tarball (3.9.1).
# - `audit`: the tarballs' npm dependency closure is the family alone, and
#   `cargo deny` passes for the crates compiled into them (3.9.2).
# - `bind`: given the signed release manifest (the `manifest` input, whose
#   SHA-256 the signed tag's message names), every artifact this run built
#   must equal the manifest's bytes (031 3.9.3, 3.11.2): the tag build
#   reproduces what the owner signed.
# - `npm`: the gated publication, in the release set's npm order, only
#   after every check above, the binding to the signed manifest, and every
#   crate of the manifest observed public with its checksum (3.1: layer 6
#   starts after the crate layers).
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The signed release tag, vX.Y.Z (the release-set file's tag); empty for a rehearsal"
        required: false
        type: string
        default: ""
      publish-npm:
        description: "Publish the npm tarballs (needs the owner's npm-publish Environment approval)"
        required: false
        type: boolean
        default: false
      rehearsal:
        description: "Build and check at the dispatched commit without a tag; attests and publishes nothing"
        required: false
        type: boolean
        default: false
      manifest:
        description: "The signed release manifest's exact bytes (rustev.release-manifest/2); required to publish"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

concurrency:
  group: ${{ inputs.rehearsal && format('release-rehearsal-{0}', github.ref) || format('release-{0}', inputs.tag) }}
  cancel-in-progress: false

jobs:
  tag:
    name: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      version: ${{ steps.tag.outputs.version }}
      epoch: ${{ steps.tag.outputs.epoch }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.rehearsal && github.sha || format('refs/tags/{0}', inputs.tag) }}
          fetch-depth: 0
      - name: The tag is the release set's, signed by the owner (021 3.8), or a rehearsal (031 3.11)
        id: tag
        env:
          REHEARSAL: ${{ inputs.rehearsal }}
          PUBLISH_NPM: ${{ inputs.publish-npm }}
          TAG: ${{ inputs.tag }}
        # Dispatched on the tag itself, so this workflow and the bindings
        # workflow it calls are the tag's own files.
        run: sh tools/rustev-release/artifacts.sh dispatch "$REHEARSAL" "$PUBLISH_NPM" "$TAG" >> "$GITHUB_OUTPUT"
      - name: The manifest is the one the signed tag names (031 3.11.2)
        if: ${{ !inputs.rehearsal && (inputs.publish-npm || inputs.manifest != '') }}
        env:
          TAG: ${{ inputs.tag }}
          MANIFEST: ${{ inputs.manifest }}
        run: |
          set -eu
          test -n "$MANIFEST" || { echo "031 3.11.2: publishing needs the signed release manifest (input manifest)" >&2; exit 1; }
          printf %s "$MANIFEST" > "$RUNNER_TEMP/release-manifest.json"
          got=$(sha256sum "$RUNNER_TEMP/release-manifest.json" | cut -d' ' -f1)
          want=$(git tag -l --format='%(contents)' "$TAG" | sed -n 's/^release-manifest-sha256: //p')
          test -n "$want" || { echo "021 3.8: the tag message names no release-manifest-sha256" >&2; exit 1; }
          test "$got" = "$want" || { echo "031 3.11.2: the manifest's SHA-256 $got is not the tag's $want" >&2; exit 1; }

  bindings:
    name: bindings
    needs: tag
    # bindings.yml asks only for `contents: read` (its top-level
    # permissions; no job requests more), and uploading artifacts needs no
    # token permission, so the caller's `contents: read` is enough. The
    # addons are attested here, in `pack`, not there.
    permissions:
      contents: read
    uses: ./.github/workflows/bindings.yml

  cli:
    name: cli ${{ matrix.platform }}
    needs: tag
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The platforms and runners of spec 027 3.13.1 (bindings.yml); the
        # build images are fixed in tools/rustev-release/artifacts.sh.
        include: &platforms
          - { platform: linux-x64-gnu, runner: ubuntu-24.04 }
          - { platform: linux-arm64-gnu, runner: ubuntu-24.04-arm }
          - { platform: linux-x64-musl, runner: ubuntu-24.04 }
          - { platform: linux-arm64-musl, runner: ubuntu-24.04-arm }
          - { platform: darwin-arm64, runner: macos-15 }
          - { platform: darwin-x64, runner: macos-15-intel }
          - { platform: win32-x64-msvc, runner: windows-2025 }
    defaults:
      run:
        shell: bash
    steps:
      # As in `rebuild`: no CRLF conversion on Windows, so both builds read
      # the committed bytes (031 3.9.3).
      - name: Check out committed bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.tag.outputs.commit }}
      - name: Build and smoke test the CLI (031 3.9.7d; 021 3.7)
        # The CLI has no version command (spec 006), so 3.9.7d's version
        # step is the archive name here; help and a reference plan check
        # against the conformance suite's golden run.
        env:
          PLATFORM: ${{ matrix.platform }}
          EPOCH: ${{ needs.tag.outputs.epoch }}
        run: sh tools/rustev-release/artifacts.sh build-native "$PLATFORM" cli dist/native "$EPOCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-raw-${{ matrix.platform }}
          path: dist/native/cli
          if-no-files-found: error

  rebuild:
    name: rebuild ${{ matrix.platform }}
    needs: tag
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: *platforms
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out committed bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.tag.outputs.commit }}
      - name: Build the CLI and the addon a second time (031 3.9.3)
        env:
          PLATFORM: ${{ matrix.platform }}
          EPOCH: ${{ needs.tag.outputs.epoch }}
        run: sh tools/rustev-release/artifacts.sh build-native "$PLATFORM" rebuild dist/native "$EPOCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rebuild-raw-${{ matrix.platform }}
          path: dist/native
          if-no-files-found: error

  archive:
    name: archive
    needs: [tag, cli, rebuild]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.tag.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-raw-*
          path: dist/release/raw
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rebuild-raw-*
          path: dist/rebuild-native
          merge-multiple: true
      - name: Archive both builds in a fixed order, owner and time (031 3.9.3)
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          EPOCH: ${{ needs.tag.outputs.epoch }}
        run: |
          set -eu
          sh tools/rustev-release/artifacts.sh archive-cli dist/release/raw dist/release/archives "$VERSION" "$EPOCH"
          sh tools/rustev-release/artifacts.sh archive-cli dist/rebuild-native/cli dist/rebuild/archives "$VERSION" "$EPOCH"
      - name: Attest build provenance (031 3.9.5)
        if: ${{ !inputs.rehearsal }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/archives/rustev-*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli
          path: dist/release/archives
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-rebuild
          path: dist/rebuild/archives
          if-no-files-found: error

  pack:
    name: pack ${{ matrix.run }}
    needs: [tag, bindings, rebuild]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        run: [release, rebuild]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.tag.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install the pinned WebAssembly tools (027 3.10.2)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install --locked --root ~/wasm-tools/wasm-bindgen-0.2.129 wasm-bindgen-cli --version 0.2.129
          cargo install --locked --root ~/wasm-tools/wasm-opt-0.116.1 wasm-opt --version 0.116.1
          echo "$HOME/wasm-tools/wasm-bindgen-0.2.129/bin" >> "$GITHUB_PATH"
          echo "$HOME/wasm-tools/wasm-opt-0.116.1/bin" >> "$GITHUB_PATH"
      - name: The release's addons, from bindings
        if: matrix.run == 'release'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rustev-*
          path: dist/addons
          merge-multiple: true
      - name: The rebuild's addons
        if: matrix.run == 'rebuild'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rebuild-raw-*
          path: dist/rebuild-native
          merge-multiple: true
      - name: Stage each addon and pack the npm members in release order (031 3.1, 3.9.3)
        env:
          RUN: ${{ matrix.run }}
          EPOCH: ${{ needs.tag.outputs.epoch }}
        run: |
          set -eu
          addons=dist/addons
          if [ "$RUN" = rebuild ]; then addons=dist/rebuild-native/addons; fi
          sh tools/rustev-release/artifacts.sh pack "$addons" dist/npm "$EPOCH"
          ls dist/npm
      - name: Attest build provenance (031 3.9.5)
        if: ${{ matrix.run == 'release' && !inputs.rehearsal }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/npm/*.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Only the release run's tarballs are the ones `npm` publishes.
          name: ${{ matrix.run == 'release' && 'npm' || 'npm-rebuild' }}
          path: dist/npm
          if-no-files-found: error

  reproducibility:
    name: reproducibility
    needs: [tag, archive, pack]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.tag.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-raw-*
          path: dist/release/raw
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rustev-*
          path: dist/release/addons
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli
          path: dist/release/archives
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm
          path: dist/release/npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rebuild-raw-*
          path: dist/rebuild-native
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-rebuild
          path: dist/rebuild/archives
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-rebuild
          path: dist/rebuild/npm
      - name: Compare the two builds byte for byte (031 3.9.3)
        run: |
          set -eu
          mv dist/rebuild-native/cli dist/rebuild/raw
          mv dist/rebuild-native/addons dist/rebuild/addons
          # A difference fails here and is explained in the report; it is
          # never normalized away.
          cargo run --quiet --locked -p rustev-release -- compare-artifacts dist/release dist/rebuild > artifact-reproducibility.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: artifact-reproducibility
          path: artifact-reproducibility.json
          if-no-files-found: ignore

  sbom:
    name: sbom
    needs: [tag, archive, pack]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.tag.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli
          path: dist/sbom
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm
          path: dist/sbom
      - name: A CycloneDX SBOM per artifact (031 3.9.1)
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          EPOCH: ${{ needs.tag.outputs.epoch }}
        run: |
          set -eu
          cargo install cargo-cyclonedx --locked --version 0.5.9
          sh tools/rustev-release/artifacts.sh sbom dist/sbom "$VERSION" "$EPOCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: dist/sbom/*.cdx.json
          if-no-files-found: error

  audit:
    name: audit
    needs: [tag, pack]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.tag.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm
          path: dist/npm
      - name: The npm closure and the compiled crates' audit (031 3.9.2; 021 3.6)
        run: |
          set -eu
          cargo install cargo-deny --locked --version 0.20.2
          sh tools/rustev-release/artifacts.sh audit dist/npm

  bind:
    name: bind
    needs: [tag, archive, pack, sbom]
    if: ${{ !inputs.rehearsal && inputs.manifest != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.tag.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli
          path: dist/artifacts/cli
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm
          path: dist/artifacts/npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: dist/artifacts/sbom
      - name: Every artifact equals the signed manifest's bytes (031 3.9.3, 3.11.2)
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          set -eu
          printf %s "$MANIFEST" > "$RUNNER_TEMP/release-manifest.json"
          cargo run --quiet --locked -p rustev-release -- verify-artifacts "$RUNNER_TEMP/release-manifest.json" dist/artifacts

  npm:
    name: npm publish
    needs: [tag, pack, reproducibility, sbom, audit, bind]
    if: ${{ inputs.publish-npm && !inputs.rehearsal }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The owner approves this Environment for each publication (031 3.11).
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.tag.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Trusted publishing authenticates with the job's OIDC token and needs
      # npm 11.5.1 or later; Node 22 bundles npm 10. No registry-url is set,
      # so no .npmrc expects a NODE_AUTH_TOKEN, and no token exists here.
      - name: Install the pinned npm for trusted publishing
        # Pinned by content: the tarball's SHA-512 must equal the registry's
        # integrity recorded here for npm 11.21.0 before it is installed.
        env:
          NPM_INTEGRITY: sha512-Zov8KhamNneiLdELtj5YALtNmJW4L4fCLTzjfpzXG2w6MSHcf0UxgdlK5uloCuksWT+7mGUU7wi79cO6RqivPg==
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/npm-11.21.0.tgz" https://registry.npmjs.org/npm/-/npm-11.21.0.tgz
          got="sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/npm-11.21.0.tgz" | base64 -w0)"
          test "$got" = "$NPM_INTEGRITY" || { echo "031 3.12: npm tarball integrity $got is not $NPM_INTEGRITY" >&2; exit 1; }
          npm install -g --ignore-scripts "$RUNNER_TEMP/npm-11.21.0.tgz"
          test "$(npm --version)" = 11.21.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm
          path: dist/npm
      - name: Every crate layer is public with its expected checksum (031 3.1)
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          set -eu
          printf %s "$MANIFEST" > "$RUNNER_TEMP/release-manifest.json"
          cargo run --quiet --locked -p rustev-release -- observe-crates "$RUNNER_TEMP/release-manifest.json"
      - name: Publish with npm provenance, in the release set's order (031 3.9.6)
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          set -eu
          (cd dist/npm && sha256sum -c SHA256SUMS)
          jq -r '.npm[].name' tools/rustev-release/release-set.json | while read -r name; do
            file="dist/npm/$(printf %s "$name" | sed 's/^@//; s|/|-|')-$VERSION.tgz"
            test -f "$file" || { echo "031 3.12: no tarball for $name ($file)" >&2; exit 1; }
            # An already public identical version is skipped by npm's own
            # refusal; any refusal stops the run (021 3.9: no blind retry).
            npm publish "$file" --provenance --access public
          done
