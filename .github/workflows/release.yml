# The release workflow of spec 058 (amending 021, 031, 053 and 056): one
# run, started by the owner's signed annotated tag, releases the family.
# Not rendered by the setup profile: owned in text by 031 3.12 and 058. It
# is not a required job of ci-gate.
#
# A push of `vX.Y.Z` on a commit of main builds every artifact once at the
# tagged commit, builds each a second time on independent runners and
# requires identical bytes (3.2.2), writes the SBOMs and audits (3.2.3),
# generates the manifest and SHA256SUMS from what it built and attests every
# file (3.2.4, 3.2.5), then publishes crates and npm packages through
# trusted publishing (3.3), creates and verifies the GitHub release (3.3.3,
# 3.4.1) and ends with the fresh-consumer qualification (3.4.2). The signed
# tag is the owner's publication instruction (3.1.2); the `release`
# Environment has no reviewer, so no job waits for a person.
#
# A candidate tag `vX.Y.Z-rc.N` runs the same builds and checks and ends at a
# GitHub pre-release, never latest: no `approve`, no registry, no
# qualification (3.7). `workflow_dispatch` is a dry run at the dispatched
# commit: every build and check, attesting and publishing nothing (3.1.5).
# A failed run resumes by rerunning its failed jobs; every publication step
# skips what is already public with the run's checksum and fails on any
# other (3.5).
#
# - `tag`: 3.1.1 through `rustev-release tag`: the form, the annotated tag's
#   signature against `tools/rustev-release/allowed_signers`, the release
#   set's version at the commit, reachability from main, and ci-gate's
#   success on the commit (its check runs, read here with `gh api`).
# - `bindings`, `cli`, `rebuild`, `archive`, `pack`: the addons, CLI
#   binaries, archives and npm tarballs, each built twice (031 3.9.3).
# - `crates`: the `.crate` archives packaged in two clean checkouts at the
#   commit time, the archive policy, the unpacked tests on the pinned
#   toolchain and the MSRV, `cargo deny`, the dependency report, the crate
#   SBOMs and the changelog (`candidate.sh`, 021 3.5 to 3.7, 031 3.10).
#   `crates-rebuild` packages them again on its own runner.
# - `reproducibility`: every pair compared byte for byte, `.crate` included.
# - `sbom`, `audit`: 031 3.9.1 and 3.9.2.
# - `manifest`: `rustev.release-manifest/2` and SHA256SUMS from this run's
#   artifacts, naming the tag object; every file attested, its Sigstore
#   bundle staged as `<file>.intoto.jsonl`.
# - `approve`: the `release` Environment gate (no reviewer, A-61).
# - `publish-crates`, `publish-npm`: idempotent publication in the release
#   set's order, through crates.io and npm trusted publishing (OIDC), npm with
#   provenance; `publication.json` records each item.
# - `publish-image`: layer 7 (spec 060 3.3), only for a release tag whose
#   release set names the image: each platform's verified OCI archive pushed
#   by digest with the pinned oras, then the OCI index the manifest names
#   under the tag `X.Y.Z`, then its provenance and each platform's SBOM
#   attested. The only job that writes packages.
# - `github-release`: the release (a candidate: the pre-release), created
#   once; the only job of this file that writes contents.
# - `verify-release`: the downloaded release against the manifest, every
#   attestation against its bundle and the attestation store, and the
#   registries against the manifest.
# - `image`, `image-checks`: the rustev-serve image of 042 3.16, built twice
#   per platform, checked, compared, with SBOMs and a scan (031 3.9). While
#   the release set lists the image as absent nothing is attested or pushed,
#   no publication job depends on their result, and `qualify` waits for them
#   without depending on it. Once it is a member (060 3.1), `manifest` names
#   the image from their archives and SBOMs and `publish-image` pushes it.
# - `qualify`: qualify.yml, the last stage; its failure fails the run and
#   leaves the lifecycle at `released`. Its `contents: write` reaches only
#   qualify.yml's `attach`, which adds the `qualification-` assets to the
#   release and replaces nothing (060 3.7.3).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      tag_object: ${{ steps.tag.outputs.tag_object }}
      version: ${{ steps.tag.outputs.version }}
      epoch: ${{ steps.tag.outputs.epoch }}
      candidate: ${{ steps.tag.outputs.candidate }}
      # 060 3.1, 3.3.1: whether the manifest names the image (a member, not a
      # candidate), and whether this run pushes it (also a release tag).
      image_member: ${{ steps.image.outputs.member }}
      image: ${{ steps.image.outputs.push }}
    steps:
      - name: A tag run is a vX.Y.Z or vX.Y.Z-rc.N tag (058 3.1.1)
        if: github.event_name == 'push'
        env:
          REF: ${{ github.ref }}
        run: |
          printf '%s\n' "$REF" | grep -Eq '^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$' \
            || { echo "058 3.1.1: $REF is not a release or candidate tag" >&2; exit 1; }
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The signed tag authorizes this commit (058 3.1.1), or a dry run (3.1.5)
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT" = push ]; then
            # Annotated tag objects are fetched by tag name, never peeled.
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            commit=$(git rev-parse "refs/tags/$TAG^{commit}")
            gh api "repos/$REPO/commits/$commit/check-runs?check_name=ci-gate&per_page=100" > "$RUNNER_TEMP/check-runs.json"
            cargo run --quiet --locked -p rustev-release -- tag "$TAG" refs/remotes/origin/main "$RUNNER_TEMP/check-runs.json" > "$RUNNER_TEMP/tag.txt"
          else
            version=$(cargo run --quiet --locked -p rustev-release -- field version)
            printf 'commit=%s\ntag_object=\nversion=%s\ncandidate=false\nepoch=%s\n' "$SHA" "$version" "$(git log -1 --format=%ct "$SHA")" > "$RUNNER_TEMP/tag.txt"
          fi
          cat "$RUNNER_TEMP/tag.txt"
          test "$(sed -n 's/^commit=//p' "$RUNNER_TEMP/tag.txt")" = "$(git rev-parse HEAD)" \
            || { echo "058 3.1.1: the checkout is not the tagged commit" >&2; exit 1; }
          cat "$RUNNER_TEMP/tag.txt" >> "$GITHUB_OUTPUT"
      - name: Whether this run names and pushes the image, and why not (060 3.3.1)
        id: image
        env:
          EVENT: ${{ github.event_name }}
          CANDIDATE: ${{ steps.tag.outputs.candidate }}
        run: |
          set -eu
          member=false push=false
          if ! jq -e '.image' tools/rustev-release/release-set.json >/dev/null; then
            reason='the release set lists the image as absent'
          elif [ "$CANDIDATE" = true ]; then
            reason='a candidate never names or pushes the image (053 3.4.2)'
          elif [ "$EVENT" != push ]; then
            member=true reason='a dry run pushes nothing (058 3.1.5)'
          else
            member=true push=true reason=
          fi
          printf 'member=%s\npush=%s\n' "$member" "$push" >> "$GITHUB_OUTPUT"
          if [ "$push" = true ]; then
            echo "060 3.3.1: the image is a member; publish-image pushes it"
          else
            echo "::notice title=publish-image skipped::$reason"
          fi

  bindings:
    name: bindings
    needs: tag
    # bindings.yml asks only for `contents: read` (its top-level
    # permissions; no job requests more), and uploading artifacts needs no
    # token permission, so the caller's `contents: read` is enough. The
    # addons are attested here, in `pack`, not there.
    permissions:
      contents: read
    uses: ./.github/workflows/bindings.yml # zizmor: ignore[self-repository]

  cli:
    name: cli ${{ matrix.platform }}
    needs: tag
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The platforms and runners of spec 027 3.13.1 (bindings.yml); the
        # build images are fixed in tools/rustev-release/artifacts.sh.
        include: &platforms
          - { platform: linux-x64-gnu, runner: ubuntu-24.04 }
          - { platform: linux-arm64-gnu, runner: ubuntu-24.04-arm }
          - { platform: linux-x64-musl, runner: ubuntu-24.04 }
          - { platform: linux-arm64-musl, runner: ubuntu-24.04-arm }
          - { platform: darwin-arm64, runner: macos-15 }
          - { platform: darwin-x64, runner: macos-15-intel }
          - { platform: win32-x64-msvc, runner: windows-2025 }
    defaults:
      run:
        shell: bash
    steps:
      # As in `rebuild`: no CRLF conversion on Windows, so both builds read
      # the committed bytes (031 3.9.3).
      - name: Check out committed bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.tag.outputs.commit }}
          persist-credentials: false
      - name: Build and smoke test the CLI (031 3.9.7d; 021 3.7)
        # The CLI has no version command (spec 006), so 3.9.7d's version
        # step is the archive name here; help and a reference plan check
        # against the conformance suite's golden run.
        env:
          PLATFORM: ${{ matrix.platform }}
          EPOCH: ${{ needs.tag.outputs.epoch }}
        run: sh tools/rustev-release/artifacts.sh build-native "$PLATFORM" cli dist/native "$EPOCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-raw-${{ matrix.platform }}
          path: dist/native/cli
          if-no-files-found: error

  rebuild:
    name: rebuild ${{ matrix.platform }}
    needs: tag
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: *platforms
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out committed bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.tag.outputs.commit }}
          persist-credentials: false
      - name: Build the CLI and the addon a second time (031 3.9.3)
        env:
          PLATFORM: ${{ matrix.platform }}
          EPOCH: ${{ needs.tag.outputs.epoch }}
        run: sh tools/rustev-release/artifacts.sh build-native "$PLATFORM" rebuild dist/native "$EPOCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rebuild-raw-${{ matrix.platform }}
          path: dist/native
          if-no-files-found: error

  archive:
    name: archive
    needs: [tag, cli, rebuild]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.tag.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-raw-*
          path: dist/release/raw
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rebuild-raw-*
          path: dist/rebuild-native
          merge-multiple: true
      - name: Archive both builds in a fixed order, owner and time (031 3.9.3)
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          EPOCH: ${{ needs.tag.outputs.epoch }}
        run: |
          set -eu
          sh tools/rustev-release/artifacts.sh archive-cli dist/release/raw dist/release/archives "$VERSION" "$EPOCH"
          sh tools/rustev-release/artifacts.sh archive-cli dist/rebuild-native/cli dist/rebuild/archives "$VERSION" "$EPOCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli
          path: dist/release/archives
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-rebuild
          path: dist/rebuild/archives
          if-no-files-found: error

  pack:
    name: pack ${{ matrix.run }}
    needs: [tag, bindings, rebuild]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        run: [release, rebuild]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.tag.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # No dependency cache in a release job (cache poisoning).
          package-manager-cache: false
          node-version: 22
      - name: Install the pinned WebAssembly tools (027 3.10.2)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install --locked --root ~/wasm-tools/wasm-bindgen-0.2.129 wasm-bindgen-cli --version 0.2.129
          cargo install --locked --root ~/wasm-tools/wasm-opt-0.116.1 wasm-opt --version 0.116.1
          echo "$HOME/wasm-tools/wasm-bindgen-0.2.129/bin" >> "$GITHUB_PATH"
          echo "$HOME/wasm-tools/wasm-opt-0.116.1/bin" >> "$GITHUB_PATH"
      - name: The release's addons, from bindings
        if: matrix.run == 'release'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rustev-*
          path: dist/addons
          merge-multiple: true
      - name: The rebuild's addons
        if: matrix.run == 'rebuild'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rebuild-raw-*
          path: dist/rebuild-native
          merge-multiple: true
      - name: Stage each addon and pack the npm members in release order (031 3.1, 3.9.3)
        env:
          RUN: ${{ matrix.run }}
          EPOCH: ${{ needs.tag.outputs.epoch }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          set -eu
          addons=dist/addons
          if [ "$RUN" = rebuild ]; then addons=dist/rebuild-native/addons; fi
          # A candidate's tarballs carry X.Y.Z-rc.N (053 3.2.3).
          sh tools/rustev-release/artifacts.sh pack "$addons" dist/npm "$EPOCH" "$VERSION"
          ls dist/npm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Only the release run's tarballs are the ones `publish-npm` publishes.
          name: ${{ matrix.run == 'release' && 'npm' || 'npm-rebuild' }}
          path: dist/npm
          if-no-files-found: error

  reproducibility:
    name: reproducibility
    needs: [tag, archive, pack, crates, crates-rebuild]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.tag.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-raw-*
          path: dist/release/raw
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rustev-*
          path: dist/release/addons
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli
          path: dist/release/archives
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm
          path: dist/release/npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rebuild-raw-*
          path: dist/rebuild-native
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-rebuild
          path: dist/rebuild/archives
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-rebuild
          path: dist/rebuild/npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crates
          path: dist/crates
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crates-rebuild
          path: dist/crates-rebuild
      - name: Compare the two builds byte for byte (031 3.9.3; 058 3.2.2)
        run: |
          set -eu
          # The `.crate` archives of `crates` (its run a) and `crates-rebuild`.
          cargo run --quiet --locked -p rustev-release -- compare dist/crates/a dist/crates-rebuild
          mv dist/rebuild-native/cli dist/rebuild/raw
          mv dist/rebuild-native/addons dist/rebuild/addons
          # A difference fails here and is explained in the report; it is
          # never normalized away.
          cargo run --quiet --locked -p rustev-release -- compare-artifacts dist/release dist/rebuild > artifact-reproducibility.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: artifact-reproducibility
          path: artifact-reproducibility.json
          if-no-files-found: ignore

  sbom:
    name: sbom
    needs: [tag, archive, pack]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.tag.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli
          path: dist/sbom
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm
          path: dist/sbom
      - name: A CycloneDX SBOM per artifact (031 3.9.1)
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          EPOCH: ${{ needs.tag.outputs.epoch }}
        run: |
          set -eu
          cargo install cargo-cyclonedx --locked --version 0.5.9
          sh tools/rustev-release/artifacts.sh sbom dist/sbom "$VERSION" "$EPOCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: dist/sbom/*.cdx.json
          if-no-files-found: error

  audit:
    name: audit
    needs: [tag, pack]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.tag.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm
          path: dist/npm
      - name: The npm closure and the compiled crates' audit (031 3.9.2; 021 3.6)
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          set -eu
          cargo install cargo-deny --locked --version 0.20.2
          sh tools/rustev-release/artifacts.sh audit dist/npm "$VERSION"

  # The rustev-serve image (042 3.16; 031 3.9): each platform built twice
  # on its own native runners, checked, compared, given SBOMs and scanned.
  # The release set lists the image as absent, so nothing here is
  # attested, pushed or named in the manifest, and no publication job
  # needs these jobs. `qualify` waits for them without depending on their
  # result; a failure still fails the run.
  image:
    name: image ${{ matrix.run }} linux/${{ matrix.arch }}
    needs: tag
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        run: [release, rebuild]
        arch: [amd64, arm64]
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.tag.outputs.commit }}
          persist-credentials: false
      - name: Build and check the image (042 3.16.1; 031 3.9.3)
        env:
          ARCH: ${{ matrix.arch }}
          EPOCH: ${{ needs.tag.outputs.epoch }}
        run: sh tools/rustev-release/artifacts.sh build-image "linux/$ARCH" dist/image "$EPOCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.run }}-${{ matrix.arch }}
          path: dist/image
          if-no-files-found: error

  image-checks:
    name: image checks
    needs: [tag, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.tag.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-release-*
          path: dist/image
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-rebuild-*
          path: dist/image-rebuild
          merge-multiple: true
      - name: Compare the two builds of each platform (031 3.9.3)
        run: sh tools/rustev-release/artifacts.sh compare-image dist/image dist/image-rebuild
      - name: Install the pinned SBOM and scan tools (031 3.9.1, 3.9.2)
        run: |
          set -eu
          mkdir -p "$HOME/image-tools"
          cd "$HOME/image-tools"
          for tool in syft:1.54.1:c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47 \
                      grype:0.120.1:0a9ee97ef5ae2ee953b0a80098105052e846cdbe319a57d808b519c33cd1343d; do
            name=${tool%%:*}; rest=${tool#*:}; version=${rest%%:*}; sum=${rest#*:}
            file="${name}_${version}_linux_amd64.tar.gz"
            curl -sSfL -o "$file" "https://github.com/anchore/$name/releases/download/v$version/$file"
            echo "$sum  $file" | sha256sum -c -
            tar -xzf "$file" "$name"
          done
          echo "$HOME/image-tools" >> "$GITHUB_PATH"
          cargo install cargo-cyclonedx --locked --version 0.5.9
          cargo install cargo-deny --locked --version 0.20.2
      - name: SBOMs and the scan (031 3.9.1, 3.9.2)
        env:
          EPOCH: ${{ needs.tag.outputs.epoch }}
        run: |
          set -eu
          sh tools/rustev-release/artifacts.sh sbom-image dist/image "$EPOCH"
          sh tools/rustev-release/artifacts.sh scan-image dist/image
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: image-evidence
          path: |
            dist/image/*.sha256
            dist/image/*.cdx.json
            dist/image/*.vulnerabilities.json
          if-no-files-found: ignore

  crates:
    name: crates
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      previous: ${{ steps.crates.outputs.previous }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.tag.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # No dependency cache in a release job (cache poisoning).
          package-manager-cache: false
          node-version: 22
      # The changelog is generated from the governed corpus (031 3.10).
      - name: Read the spec-spine pin
        id: pin
        run: sh scripts/statecraft/gate.sh pin >> "$GITHUB_OUTPUT"
      - name: Restore the pinned spec-spine
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bin/spec-spine
          key: spec-spine-${{ steps.pin.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install the pinned spec-spine
        run: |
          if test -x .bin/spec-spine && .bin/spec-spine --version; then
            :
          else
            make tools
          fi
      - name: The pinned audit and SBOM tools and the MSRV toolchain (021 3.6, 3.7; 031 3.9.1)
        run: |
          set -eu
          cargo install cargo-deny --locked --version 0.20.2
          cargo install cargo-cyclonedx --locked --version 0.5.9
          rustup toolchain install "$(cargo run --quiet --locked -p rustev-release -- field msrv)" --profile minimal
      - name: Package, check and test every crate twice at the commit time (021 3.5 to 3.7)
        id: crates
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          set -eu
          # The previous release is the newest stable tag merged into this
          # commit other than this version's own (031 3.7, 3.10).
          previous=$(git tag --merged HEAD --list 'v*' --sort=-v:refname \
            | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            | grep -vx "v${VERSION%%-rc.*}" | head -n 1 || true)
          echo "previous release: ${previous:-none}"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/worktrees"
          PREVIOUS=$previous RUSTEV_WORKTREES=$RUNNER_TEMP/worktrees sh tools/rustev-release/candidate.sh
          target=$(cargo run --quiet --locked -p rustev-release -- field target)
          mv "$target/release-candidate/$(git rev-parse HEAD)" "$RUNNER_TEMP/crates"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crates
          path: ${{ runner.temp }}/crates
          if-no-files-found: error

  crates-rebuild:
    name: crates-rebuild
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.tag.outputs.commit }}
          persist-credentials: false
      - name: Package every crate a second time, on its own runner, at the commit time (021 3.7; 058 3.2.2)
        env:
          EPOCH: ${{ needs.tag.outputs.epoch }}
        run: |
          set -eu
          git ls-files -z | xargs -0 touch -h -d "$(date -u -d "@$EPOCH" +%Y-%m-%dT%H:%M:%SZ)"
          version=$(cargo run --quiet --locked -p rustev-release -- field version)
          packages=$(cargo run --quiet --locked -p rustev-release -- field packages)
          flags=""
          for p in $packages; do flags="$flags -p $p"; done
          # shellcheck disable=SC2086 # one -p per member
          SOURCE_DATE_EPOCH=$EPOCH cargo package --locked $flags
          mkdir -p "$RUNNER_TEMP/crates-rebuild"
          for p in $packages; do cp "target/package/$p-$version.crate" "$RUNNER_TEMP/crates-rebuild/"; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crates-rebuild
          path: ${{ runner.temp }}/crates-rebuild
          if-no-files-found: error

  manifest:
    name: manifest
    needs: [tag, crates, archive, pack, reproducibility, sbom, audit, image-checks]
    # The image's checks gate the manifest only once the manifest names the
    # image (060 3.4.1).
    if: >-
      !cancelled() && needs.tag.result == 'success' && needs.crates.result == 'success' &&
      needs.archive.result == 'success' && needs.pack.result == 'success' &&
      needs.reproducibility.result == 'success' && needs.sbom.result == 'success' &&
      needs.audit.result == 'success' &&
      (needs.tag.outputs.image_member != 'true' || needs.image-checks.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.tag.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crates
          path: ${{ runner.temp }}/evidence
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli
          path: ${{ runner.temp }}/artifacts/cli
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm
          path: ${{ runner.temp }}/artifacts/npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/artifacts/sbom
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.tag.outputs.image_member == 'true'
        with:
          pattern: image-release-*
          path: ${{ runner.temp }}/artifacts/image
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.tag.outputs.image_member == 'true'
        with:
          name: image-evidence
          path: ${{ runner.temp }}/image-evidence
      - name: The image's SBOMs beside the others (060 3.4.1)
        if: needs.tag.outputs.image_member == 'true'
        run: |
          set -eu
          for arch in amd64 arm64; do
            cp "$RUNNER_TEMP/image-evidence/rustev-serve-linux-$arch.oci.tar.cdx.json" "$RUNNER_TEMP/artifacts/sbom/"
          done
      - name: The manifest and SHA256SUMS from this run's artifacts (058 3.2.4)
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          CANDIDATE: ${{ needs.tag.outputs.candidate }}
          PREVIOUS: ${{ needs.crates.outputs.previous }}
        run: |
          set -eu
          cargo install cargo-deny --locked --version 0.20.2
          ev=$RUNNER_TEMP/evidence art=$RUNNER_TEMP/artifacts
          if [ "$EVENT" != push ]; then
            cargo run --quiet --locked -p rustev-release -- manifest "$ev" "$art"
          else
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            candidate=""
            if [ "$CANDIDATE" = true ]; then candidate="--candidate $TAG"; fi
            # shellcheck disable=SC2086 # the optional prefix
            cargo run --quiet --locked -p rustev-release -- $candidate run-manifest "$ev" "$art" "$TAG"
          fi
          # The release directory: every file the manifest names, flat.
          mkdir -p dist/release
          jq -r '.packages[].crate_file' "$ev/release-manifest.json" | while read -r f; do cp "$ev/a/$f" dist/release/; done
          jq -r '.artifacts[].name' "$ev/release-manifest.json" | while read -r f; do cp "$ev/$f" dist/release/; done
          cp "$ev/release-manifest.json" "$ev/SHA256SUMS" dist/release/
          # The binaries' checksum sidecars, attested with everything else.
          cp "$art"/cli/*.sha256 dist/release/
          ls dist/release
      - name: Require the OIDC token (058 3.2.5)
        if: github.event_name == 'push'
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "058 3.2.5: no OIDC token; nothing is attested or published" >&2
            exit 1
          fi
      - name: Attest build provenance of every file (031 3.9.5; 058 3.2.5)
        id: attest
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/*
      - name: Stage the Sigstore bundle beside each attested file (058 3.2.5)
        if: github.event_name == 'push'
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -eu
          if [ -z "$BUNDLE" ] || [ ! -s "$BUNDLE" ]; then
            echo "058 3.2.5: the attestation yielded no bundle; nothing is published" >&2
            exit 1
          fi
          for f in dist/release/*; do cp "$BUNDLE" "$f.intoto.jsonl"; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: dist/release
          if-no-files-found: error

  approve:
    name: approve
    needs: [tag, bindings, cli, rebuild, crates, crates-rebuild, archive, pack, reproducibility, sbom, audit, manifest]
    if: github.event_name == 'push' && needs.tag.outputs.candidate == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # No required reviewer (owner decision A-61): the signed tag alone
    # authorizes; this Environment is the one gate every publication job
    # needs (058 3.1.3).
    environment: release
    steps:
      - name: The signed tag authorizes publication (058 3.1.2)
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ needs.tag.outputs.commit }}
          OBJECT: ${{ needs.tag.outputs.tag_object }}
        run: echo "publication of $TAG (tag object $OBJECT) at $COMMIT is authorized"

  publish-crates:
    name: publish-crates
    needs: [tag, approve]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Scopes the crates.io trusted publishers; no reviewer (058 3.1.3).
    environment: crates-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.tag.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Every source file carries the commit time, as packaged (021 3.7)
        env:
          EPOCH: ${{ needs.tag.outputs.epoch }}
        run: git ls-files -z | xargs -0 touch -h -d "$(date -u -d "@$EPOCH" +%Y-%m-%dT%H:%M:%SZ)"
      - name: Build the publisher
        run: cargo build --quiet --locked -p rustev-release
      # Trusted publishing (058 3.3.1, A-61): the job's OIDC token is
      # exchanged for a short-lived crates.io token, revoked when the job
      # ends. No crates.io secret exists or is read.
      - name: Exchange the OIDC token for a crates.io publishing token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish in upload order; what is public with the run's checksum is skipped (058 3.3.1, 3.5.2)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          SOURCE_DATE_EPOCH: ${{ needs.tag.outputs.epoch }}
        run: target/debug/rustev-release publish-crates "$RUNNER_TEMP/release" "$RUNNER_TEMP/publication.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: publication-crates
          path: ${{ runner.temp }}/publication.json
          if-no-files-found: ignore
          overwrite: true

  publish-npm:
    name: publish-npm
    needs: [tag, approve, publish-crates]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Scopes the npm trusted publishers; no reviewer (058 3.1.3).
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.tag.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # No dependency cache in a release job (cache poisoning).
          package-manager-cache: false
          node-version: 22
      # Trusted publishing authenticates with the job's OIDC token and needs
      # npm 11.5.1 or later; Node 22 bundles npm 10. No registry-url is set,
      # so no .npmrc expects a NODE_AUTH_TOKEN, and no token exists here.
      - name: Install the pinned npm for trusted publishing
        # Pinned by content: the tarball's SHA-512 must equal the registry's
        # integrity recorded here for npm 11.21.0 before it is installed.
        env:
          NPM_INTEGRITY: sha512-Zov8KhamNneiLdELtj5YALtNmJW4L4fCLTzjfpzXG2w6MSHcf0UxgdlK5uloCuksWT+7mGUU7wi79cO6RqivPg==
        run: | # zizmor: ignore[adhoc-packages]
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/npm-11.21.0.tgz" https://registry.npmjs.org/npm/-/npm-11.21.0.tgz
          got="sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/npm-11.21.0.tgz" | base64 -w0)"
          test "$got" = "$NPM_INTEGRITY" || { echo "031 3.12: npm tarball integrity $got is not $NPM_INTEGRITY" >&2; exit 1; }
          # The tarball is pinned by its sha512 integrity, checked above.
          npm install -g --ignore-scripts "$RUNNER_TEMP/npm-11.21.0.tgz"
          test "$(npm --version)" = 11.21.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publication-crates
          path: ${{ runner.temp }}
      - name: Build the publisher
        run: cargo build --quiet --locked -p rustev-release
      - name: Publish with provenance in the release set's order, after every crate is public (058 3.3.2, 3.5.2)
        run: target/debug/rustev-release publish-npm "$RUNNER_TEMP/release" "$RUNNER_TEMP/publication.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: publication
          path: ${{ runner.temp }}/publication.json
          if-no-files-found: ignore
          overwrite: true

  publish-image:
    name: publish-image
    needs: [tag, manifest, approve, image, image-checks, publish-crates, publish-npm]
    # 060 3.3.1: layer 7 after layer 6, only when `tag` decided a push (a
    # release tag whose release set names the image); a candidate or a dry
    # run skips it, and `tag` names why.
    if: >-
      !cancelled() && needs.tag.outputs.image == 'true' && needs.manifest.result == 'success' &&
      needs.approve.result == 'success' && needs.image-checks.result == 'success' &&
      needs.publish-crates.result == 'success' && needs.publish-npm.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The only job that writes packages; attestation needs the other two.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ghcr.io/statecrafting/rustev-serve
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.tag.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-release-*
          path: ${{ runner.temp }}/image
          merge-multiple: true
      - name: The pinned copy tool, oras 1.3.6 (060 3.3.2)
        run: |
          set -eu
          mkdir -p "$HOME/oras" && cd "$HOME/oras"
          file=oras_1.3.6_linux_amd64.tar.gz
          curl -sSfL -o "$file" "https://github.com/oras-project/oras/releases/download/v1.3.6/$file"
          echo "66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0  $file" | sha256sum -c -
          tar -xzf "$file" oras
          echo "$HOME/oras" >> "$GITHUB_PATH"
      - name: The archives are the bytes the run built, compared and scanned (060 I-1)
        run: |
          set -eu
          cd "$RUNNER_TEMP/image"
          for arch in amd64 arm64; do sha256sum -c "rustev-serve-linux-$arch.oci.tar.sha256"; done
      - name: The tag is absent or already the run's index; another fails (060 3.3.3)
        id: state
        run: |
          set -eu
          state=$(cargo run --quiet --locked -p rustev-release -- image-tag "$RUNNER_TEMP/release" "$RUNNER_TEMP/index.json")
          echo "$IMAGE:$VERSION is $state"
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Push each platform by digest, then the index under X.Y.Z (060 3.3.2)
        if: steps.state.outputs.state == 'absent'
        run: |
          set -eu
          printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          manifest="$RUNNER_TEMP/release/release-manifest.json"
          for arch in amd64 arm64; do
            digest=$(jq -r --arg p "linux/$arch" '.image.platforms[] | select(.platform == $p) | .digest' "$manifest")
            # By digest from the run's archive, never rebuilt; no tag.
            oras cp --from-oci-layout "$RUNNER_TEMP/image/rustev-serve-linux-$arch.oci.tar@$digest" "$IMAGE"
            oras manifest fetch --descriptor "$IMAGE@$digest" >/dev/null
          done
          oras manifest push --media-type application/vnd.oci.image.index.v1+json "$IMAGE:$VERSION" "$RUNNER_TEMP/index.json"
          test "$(cargo run --quiet --locked -p rustev-release -- image-tag "$RUNNER_TEMP/release" "$RUNNER_TEMP/index.json")" = present \
            || { echo "060 3.3.2: $IMAGE:$VERSION does not name the manifest's index after the push" >&2; exit 1; }
      - name: The index and platform digests to attest
        id: digests
        run: |
          set -eu
          manifest="$RUNNER_TEMP/release/release-manifest.json"
          {
            echo "index=$(jq -r '.image.index_digest' "$manifest")"
            echo "amd64=$(jq -r '.image.platforms[] | select(.platform == "linux/amd64") | .digest' "$manifest")"
            echo "arm64=$(jq -r '.image.platforms[] | select(.platform == "linux/arm64") | .digest' "$manifest")"
          } >> "$GITHUB_OUTPUT"
      # 060 3.3.4: keyless Sigstore attestations, the image's signature
      # (031 3.9.5); Build Level 2. A rerun attests again, which only adds.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digests.outputs.index }}
          push-to-registry: true
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digests.outputs.amd64 }}
          sbom-path: ${{ runner.temp }}/release/rustev-serve-linux-amd64.oci.tar.cdx.json
          push-to-registry: true
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digests.outputs.arm64 }}
          sbom-path: ${{ runner.temp }}/release/rustev-serve-linux-arm64.oci.tar.cdx.json
          push-to-registry: true

  github-release:
    name: github-release
    needs: [tag, bindings, cli, rebuild, crates, crates-rebuild, archive, pack, reproducibility, sbom, audit, manifest, approve, publish-crates, publish-npm, publish-image]
    # A release after npm and, once a member, the image (060 3.3.1); a
    # candidate straight after `manifest` (3.7).
    if: >-
      !cancelled() && github.event_name == 'push' && needs.manifest.result == 'success' &&
      (needs.tag.outputs.candidate == 'true' || (needs.publish-npm.result == 'success' &&
      (needs.tag.outputs.image != 'true' || needs.publish-image.result == 'success')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The only job of this workflow that may write contents (058 3.3.3).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.tag.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.tag.outputs.candidate == 'false'
        with:
          name: publication
          path: ${{ runner.temp }}/release
      - name: Create the release once; identical assets are success, any difference fails (058 3.3.3, 3.5.2)
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run --quiet --locked -p rustev-release -- github-release "$RUNNER_TEMP/release"

  verify-release:
    name: verify-release
    needs: [tag, github-release]
    if: ${{ !cancelled() && needs.github-release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # attestations: read, for `gh attestation verify` against the store;
    # packages: read, to read the image's registry state (060 3.4.2).
    permissions:
      contents: read
      attestations: read
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.tag.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # No dependency cache in a release job (cache poisoning).
          package-manager-cache: false
          node-version: 22
      - name: Every asset is present and equals the manifest and SHA256SUMS (058 3.4.1)
        run: |
          set -eu
          gh release download "$TAG" --repo "$REPO" --dir "$RUNNER_TEMP/published"
          cargo run --quiet --locked -p rustev-release -- verify-assets "$RUNNER_TEMP/published"
      - name: Every attestation verifies against its bundle and the attestation store (058 3.4.1)
        run: |
          set -u
          failures=0
          for bundle in "$RUNNER_TEMP"/published/*.intoto.jsonl; do
            f=${bundle%.intoto.jsonl}
            gh attestation verify "$f" --bundle "$bundle" --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/release.yml" --source-ref "refs/tags/$TAG" \
              || { echo "058 3.4.1: $f does not verify against its bundle" >&2; failures=$((failures + 1)); }
            gh attestation verify "$f" --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/release.yml" --source-ref "refs/tags/$TAG" \
              || { echo "058 3.4.1: $f does not verify against the attestation store" >&2; failures=$((failures + 1)); }
          done
          test "$failures" -eq 0 || { echo "058 3.4.1: $failures attestation check(s) failed; nothing is unpublished" >&2; exit 1; }
      - name: The registries hold the manifest's checksums, and npm signatures verify (058 3.4.1)
        if: needs.tag.outputs.candidate == 'false'
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: | # zizmor: ignore[adhoc-packages]
          set -eu
          cargo run --quiet --locked -p rustev-release -- observe-registries "$RUNNER_TEMP/published/release-manifest.json"
          names=$(jq -r --arg v "$VERSION" '.npm[].name + "@" + $v' tools/rustev-release/release-set.json)
          mkdir "$RUNNER_TEMP/audit" && cd "$RUNNER_TEMP/audit"
          npm init -y >/dev/null
          # Every platform package, whatever this host's platform.
          # shellcheck disable=SC2086 # one argument per package
          # The just-published packages, checked by `npm audit signatures` next.
          npm install --ignore-scripts --force --no-audit --no-fund $names
          npm audit signatures
      - name: The registry holds the manifest's image, and its attestations verify (060 3.4.2)
        if: needs.tag.outputs.image == 'true'
        env:
          IMAGE: ghcr.io/statecrafting/rustev-serve
        run: |
          set -eu
          manifest="$RUNNER_TEMP/published/release-manifest.json"
          cargo run --quiet --locked -p rustev-release -- verify-image "$RUNNER_TEMP/published"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          gh attestation verify "oci://$IMAGE@$(jq -r '.image.index_digest' "$manifest")" --repo "$REPO" \
            --signer-workflow "$REPO/.github/workflows/release.yml" --source-ref "refs/tags/$TAG"
          for digest in $(jq -r '.image.platforms[].digest' "$manifest"); do
            gh attestation verify "oci://$IMAGE@$digest" --repo "$REPO" --predicate-type https://cyclonedx.org/bom \
              --signer-workflow "$REPO/.github/workflows/release.yml" --source-ref "refs/tags/$TAG"
          done

  qualify:
    name: qualify
    # Last (058 3.4.2): it also waits for the image checks, but its `if`
    # reads only verify-release, so an image failure fails the run without
    # holding back qualification while the image is absent.
    needs: [tag, verify-release, image-checks]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.tag.outputs.candidate == 'false' && needs.verify-release.result == 'success' }}
    # The ceiling of qualify.yml's jobs: only its `attach` takes
    # `contents: write` (060 3.7.3); the others read.
    permissions:
      contents: write
      attestations: read
      packages: read
    uses: ./.github/workflows/qualify.yml # zizmor: ignore[self-repository]
    with:
      tag: ${{ github.ref_name }}
