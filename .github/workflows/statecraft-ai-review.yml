name: statecraft-ai-review

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
    outputs:
      result:
        description: findings, no-findings, or skipped:<class>
        value: ${{ jobs.review.outputs.result }}
      release_candidate:
        description: whether the head ref matches the release branch pattern
        value: ${{ jobs.review.outputs.release_candidate }}

permissions:
  contents: read

jobs:
  review:
    name: review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    outputs:
      result: ${{ steps.review.outputs.result }}
      release_candidate: ${{ steps.review.outputs.release_candidate }}
