# The release family's continuous checks of spec 031 (3.5, 3.6.7, 3.8), a
# reusable workflow that ci-gate calls and requires (ci.extra_required_jobs).
# Not rendered by the setup profile: owned by spec 031.
#
# - `adoption`: each partial-adoption subset as a fresh consumer of the
#   facade, its graph checked for omitted crates (3.5, R-1).
# - `msrv`: every release member built and tested at the declared MSRV
#   (3.6.7).
# - `semver`: cargo-semver-checks against the previous release, or
#   `no-baseline` when none exists, recorded as not applicable (3.8, R-3).
name: release-checks

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  # A pull request's own run (unless labelled `statecraft:stacked-ci`)
  # leaves the release checks out when it changes no workspace package, no
  # workspace-wide file, no conformance JavaScript tooling and not this
  # workflow (scripts/acceptance/affected.py): a change to specs or
  # documents alone. The merge queue and every push to main run them all.
  # Any doubt runs them.
  scope:
    name: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.affected.outputs.run }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: affected
        env:
          EVENT: ${{ github.event_name }}
          STACKED_CI: ${{ contains(github.event.pull_request.labels.*.name, 'statecraft:stacked-ci') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Reading the manifests needs no pinned toolchain; the image's
          # stable cargo avoids installing it here.
          RUSTUP_TOOLCHAIN: stable
        run: |
          if [ "$EVENT" = pull_request ] && [ "$STACKED_CI" != true ]; then
            run=$(python3 scripts/acceptance/affected.py --base "$BASE_SHA" --all-packages \
              --path tools/rustev-conformance/js/ --path .github/workflows/release-checks.yml \
              --path scripts/acceptance/affected.py)
          else
            run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = false ]; then
            echo "This pull request changes no release-check input; the release checks run in the merge queue." >> "$GITHUB_STEP_SUMMARY"
          fi

  adoption:
    name: adoption ${{ matrix.subset }}
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        subset: [documents, embedded, evaluation, remote-http, runtime, rules, remote-http-alone, otel]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Restored everywhere, saved only from main (as in verify.yml): saves
      # from pull requests and merge-queue branches, which nothing else can
      # read, evicted main's entries from the 10 GB repository limit.
      - name: Restore cargo registry and git
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: adoption-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            adoption-${{ runner.os }}-
      - name: Subset ${{ matrix.subset }} (031 3.5)
        run: sh tools/rustev-release/adoption.sh ${{ matrix.subset }}
      - name: Subsets whose crate is not in this release
        if: matrix.subset == 'documents'
        run: sh tools/rustev-release/adoption.sh serve bedrock typesafe local-embed
      - name: Save the cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  msrv:
    name: msrv
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Restored everywhere, saved only from main (as in verify.yml): saves
      # from pull requests and merge-queue branches, which nothing else can
      # read, evicted main's entries from the 10 GB repository limit.
      # Registry and git only: the MSRV target directory was 4 GB, the largest
      # entry, and this job is off the critical path.
      - name: Restore cargo registry and git
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: msrv-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml') }}
          restore-keys: |
            msrv-${{ runner.os }}-
      - name: Install the declared MSRV toolchain
        run: |
          msrv=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "rustev-contract") | .rust_version')
          rustup toolchain install "$msrv" --profile minimal
      - name: Release members at the MSRV (031 3.6.7)
        run: make msrv
      - name: Save the cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  semver:
    name: semver
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Restored everywhere, saved only from main (as in verify.yml): saves
      # from pull requests and merge-queue branches, which nothing else can
      # read, evicted main's entries from the 10 GB repository limit.
      - name: Restore cargo registry, git and target
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: semver-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            semver-${{ runner.os }}-
      - name: Cache the pinned cargo-semver-checks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/semver-tools
          key: cargo-semver-checks-0.51.0-${{ runner.os }}
      - name: Install the pinned cargo-semver-checks (031 3.8)
        run: |
          test -x ~/semver-tools/bin/cargo-semver-checks || cargo install --locked --root ~/semver-tools cargo-semver-checks --version 0.51.0
          echo "$HOME/semver-tools/bin" >> "$GITHUB_PATH"
      # Once @rustev/rustev-wasm has an npm baseline, semver.sh stages its
      # declarations with wasm-bindgen (031 3.8), so the job needs the pins of
      # 027 3.10.2, each under a root named by its version.
      - name: Cache the pinned wasm-bindgen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/wasm-tools/wasm-bindgen-0.2.129
          key: wasm-bindgen-0.2.129-${{ runner.os }}
      - name: Install the WebAssembly target and the pinned wasm-bindgen (027 3.10.2)
        run: |
          rustup target add wasm32-unknown-unknown
          test -x ~/wasm-tools/wasm-bindgen-0.2.129/bin/wasm-bindgen || cargo install --locked --root ~/wasm-tools/wasm-bindgen-0.2.129 wasm-bindgen-cli --version 0.2.129
          echo "$HOME/wasm-tools/wasm-bindgen-0.2.129/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: The npm declaration diff and its tests, with the pinned TypeScript (031 3.8)
        run: |
          npm ci --prefix tools/rustev-conformance/js
          node --test tools/rustev-release/npm-api-diff.test.mjs
      - name: API compatibility against the previous release (031 3.8)
        run: |
          make semver
          {
            echo '### API compatibility (spec 031 3.8)'
            echo
            echo '`no-baseline` means no previous release exists: not applicable, never a pass.'
            echo
            sed 's/^/- /' target/semver.txt
          } >> "$GITHUB_STEP_SUMMARY"
      # Cargo fingerprints workspace sources by mtime, which a fresh checkout
      # resets, so workspace crates always rebuild: their artifacts are dead
      # weight in the cache. Only dependencies are kept.
      - name: Drop workspace artifacts before saving (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        run: cargo metadata --format-version 1 --no-deps | jq -r '.packages[].name' | sed 's/^/-p /' | xargs -r cargo clean
      - name: Save the cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Upload the report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semver-report
          path: target/semver.txt
          if-no-files-found: error

  # As verify.yml's `verify`: the caller's result is this job's, and a
  # skipped release check passes only when `scope` chose to leave it out.
  release-checks:
    name: release-checks
    if: always()
    needs: [scope, adoption, msrv, semver]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every release check
        env:
          SCOPE: ${{ needs.scope.result }}
          RUN: ${{ needs.scope.outputs.run }}
          RESULTS: ${{ needs.adoption.result }} ${{ needs.msrv.result }} ${{ needs.semver.result }}
        run: |
          test "$SCOPE" = success
          want=success; [ "$RUN" = false ] && want=skipped
          for r in $RESULTS; do test "$r" = "$want" || { echo "a release check is $r, expected $want"; exit 1; }; done
