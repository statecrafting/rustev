# Spec: 001-boundaries-and-authority owns this manifest.
# Members are directory globs. A spec that adds a crate directory extends this
# manifest (an `extends` edge) and claims the directory itself.
[workspace]
resolver = "3"
members = [
  "crates/*",
  "backends/*",
  "tools/*",
  "integrations/*",
  "packages/*",
  # The differential floating-point corpus (spec 027, 3.11.3), a crate of
  # its own inside the conformance suite's directory.
  "tools/rustev-conformance/fp-corpus",
]

[workspace.package]
# One lockstep family version for the eight first-release packages (spec 021,
# 3.2); each internal dependency below names it exactly.
version = "0.1.0"
edition = "2024"
# The MSRV: the oldest toolchain that builds the release members. 1.88
# stabilized the `let` chains rustev-core uses; 1.87 refuses them (spec 021,
# 3.7 candidate matrix; spec 031, 3.6.7).
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/statecrafting/rustev"
homepage = "https://github.com/statecrafting/rustev"
readme = "README.md"

[workspace.dependencies]
# The first-release family (spec 021, 3.2): an exact `=X.Y.Z` version beside
# the path, so a packaged manifest resolves from the registry by version alone.
rustev-contract = { path = "crates/rustev-contract", version = "=0.1.0" }
rustev-core = { path = "crates/rustev-core", version = "=0.1.0" }
rustev-runtime = { path = "crates/rustev-runtime", version = "=0.1.0" }
rustev-eval = { path = "crates/rustev-eval", version = "=0.1.0" }
rustev-backend-rules = { path = "backends/rustev-backend-rules", version = "=0.1.0" }
rustev-remote-http = { path = "integrations/rustev-remote-http", version = "=0.1.0" }
rustev-cli = { path = "crates/rustev-cli", version = "=0.1.0" }
rustev-surface = { path = "crates/rustev-surface", version = "=0.1.0" }
rustev-pkg-support-routing = { path = "packages/rustev-pkg-support-routing", version = "=0.1.0" }
rustev-pkg-lodging = { path = "packages/rustev-pkg-lodging", version = "=0.1.0" }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: parsing is correctly rounded, so a retained output parses
# to exactly the value that was supplied (spec 004, 5.6).
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = { version = "0.10", default-features = false }
# HMAC over `sha2` for the redaction policy's keyed digest (spec 028, 3.4.5);
# the 0.12 line is the one built on the `digest` 0.10 that `sha2` 0.10 uses.
hmac = { version = "0.12", default-features = false }
# `exp` and `ln` for the pure crates (spec 047): one pure Rust
# implementation on every target, exact-pinned; without default features it
# takes no architecture-specific path.
libm = { version = "=0.2.16", default-features = false }
# JSON Schema emission for the contract's documents (spec 027, 3.2.2): pure,
# no I/O, exact-pinned so emitted schemas stay byte-identical.
schemars = { version = "=1.2.3", default-features = false, features = ["derive", "std"] }
# The runtime's executor (R-03); never a dependency of rustev-contract or
# rustev-core (spec 001, 3.4.1). Added by spec 003.
tokio = { version = "1.53", default-features = false }
# The HTTP stack and TLS of the remote adapter binding (spec 009, 3.11).
# rustls 0.23.46 is the floor: earlier releases carry RUSTSEC-2026-0346 to
# 0349 (spec 021, 3.6 audit). webpki-roots 1.0.10 is the floor and the lock
# holds rustls-webpki 0.103.16: earlier releases carry RUSTSEC-2026-0381 and
# 0382 (distrusted emSign intermediates).
# Only crates under `integrations/` may depend on these (spec 001, 3.4.2);
# `make boundaries` refuses them anywhere else.
hyper = { version = "1.9", default-features = false }
hyper-util = { version = "0.1.17", default-features = false }
http-body-util = { version = "0.1", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
# AWS Bedrock (spec 030, 3.5): SigV4 signing and credential types only; the
# full AWS SDK is not a dependency. aws-config is behind rustev-bedrock's
# optional `aws-config` feature.
aws-sigv4 = { version = "1.6.3", default-features = false, features = ["sign-http", "http1"] }
aws-credential-types = { version = "1.3.1", default-features = false }
aws-config = { version = "1.13.0", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# rustev-serve (spec 010 3.4 binding record, A-47): Ed25519 bundle signatures
# and offline Sigstore bundle verification against a host-supplied trusted
# root. Used only under integrations/ (spec 042 3.18).
ring = { version = "0.17.14", default-features = false }
sigstore-verify = { version = "=0.15.0", default-features = false, features = ["aws-lc-rs"] }
# rustev-serve's gRPC transport (spec 042 3.9; binding record item 1). The
# generator runs at development time and its output is committed.
tonic = { version = "=0.14.6", default-features = false, features = ["codegen", "server"] }
tonic-prost = { version = "=0.14.6", default-features = false }
prost = { version = "=0.14.4", default-features = false, features = ["std", "derive"] }
# Development-time generator only (a dev-dependency of rustev-serve); the
# boundary check refuses the gRPC family outside integrations/ (042 3.18).
tonic-prost-build = { version = "=0.14.6", default-features = false }
webpki-roots = { version = "1.0.10", default-features = false }
# The telemetry exporter family (spec 028, 3.2.3 "Dependencies",
# and 3.12 "Dependency boundary", which forbids every `opentelemetry*`
# package outside `integrations/`): one exact minor line, no default
# features, used only by integrations/rustev-otel behind its `otlp-grpc`
# and `otlp-http` features; `make boundaries` refuses them anywhere else.
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs", "rt-tokio"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# The WebAssembly module's build (spec 027, 3.10): size first, one codegen
# unit, link-time optimization, no unwinding, no debug data. Only
# `make bindings` uses it; every other build keeps the default profiles.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
