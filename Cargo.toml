# Spec: 001-boundaries-and-authority owns this manifest.
# Members are directory globs. A spec that adds a crate directory extends this
# manifest (an `extends` edge) and claims the directory itself.
[workspace]
resolver = "3"
members = ["crates/*", "backends/*", "tools/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/statecrafting/rustev"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
# The runtime's executor (R-03); never a dependency of rustev-contract or
# rustev-core (spec 001, 3.4.1). Added by spec 003.
tokio = { version = "1.53", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
