[package]
name = "rustev-serve"
version = "0.1.0"
description = "The Rustev decision service: host-registered plans served over HTTP/1.1, HTTP/2 and gRPC with mutual TLS (spec 010 3.7, spec 042)."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.spec-spine]
spec = "010-integrations"

[dependencies]
# Spec 009's Part A machinery (spec 059 3.2.1).
rustev-remote-http.workspace = true
rustev-contract = { workspace = true }
rustev-core = { workspace = true, features = ["parameterized"] }
rustev-runtime = { workspace = true }
rustev-surface = { workspace = true, features = ["parameterized"] }
rustev-eval = { workspace = true, features = ["parameterized"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["net", "time", "rt", "rt-multi-thread", "sync", "macros", "io-util", "signal", "fs"] }
hyper = { workspace = true, features = ["server", "client", "http1", "http2"] }
hyper-util = { workspace = true, features = ["tokio", "server", "server-auto", "server-graceful"] }
http-body-util.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
ring.workspace = true
sigstore-verify.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
prost.workspace = true
webpki-roots.workspace = true
# Spec 011, 3.17.3: the local embedding backend, registered from the host's
# configuration at startup. Optional, so a build without `local-embed` has
# no crate of the local inference family (011 3.20.2); `synthetic`, as in the
# Node binding, since a synthetic bundle constructs on any target (3.6.3).
rustev-backend-embed-linear = { workspace = true, optional = true, features = ["synthetic"] }

[features]
# Spec 011, 3.17.3. Off by default; the service image is built without it
# (spec 060).
local-embed = ["dep:rustev-backend-embed-linear"]

[[bin]]
name = "rustev-serve"
path = "src/main.rs"

[dev-dependencies]
# Throwaway test PKI generated at test time; no private key is committed.
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
tonic-prost-build.workspace = true
# The shared conformance suite (spec 042, 3.17): its manifest, fixtures and
# normalizations, and the rules backend its run goldens use.
rustev-conformance = { path = "../../tools/rustev-conformance" }
rustev-backend-rules.workspace = true
tokio = { workspace = true, features = ["test-util"] }
