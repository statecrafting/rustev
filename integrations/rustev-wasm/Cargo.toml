[package]
name = "rustev-wasm"
version.workspace = true
description = "Rustev's pure commands as a WebAssembly module: check, compile, show, offline replay, evaluation, gates and calibration."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Spec 027 section 2 and spec 031 3.1: shipped only as an npm package.
publish = false

[package.metadata.spec-spine]
spec = "027-node-and-wasm-bindings"

[lib]
crate-type = ["cdylib", "rlib"]

# Spec 027, 3.14.3: no runtime, executor, HTTP stack, Node-API crate,
# randomness, `web-sys` or `wasm-bindgen-futures` in this graph.
[dependencies]
rustev-contract.workspace = true
rustev-core.workspace = true
rustev-eval.workspace = true
rustev-surface.workspace = true
serde_json.workspace = true
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"

[lints]
workspace = true
