[package]
name = "rustev-node"
version.workspace = true
description = "Rustev's Node-API binding: compile, decide, replay and evaluate in-process, with host-implemented seams."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Spec 027 section 2 and spec 031 3.1: shipped only as npm packages.
publish = false

[package.metadata.spec-spine]
spec = "027-node-and-wasm-bindings"

[lib]
crate-type = ["cdylib"]

[dependencies]
# 049 3.1.4: only OTLP/HTTP is enabled for this binding. Cargo.lock does not
# change: it already records rustev-otel's optional OTLP dependencies, and
# `cargo metadata --locked` and `cargo build --locked` pass with this feature.
rustev-otel = { workspace = true, features = ["otlp-http"] }
rustev-contract.workspace = true
rustev-core = { workspace = true, features = ["parameterized"] }
rustev-runtime.workspace = true
rustev-eval = { workspace = true, features = ["parameterized"] }
rustev-surface = { workspace = true, features = ["parameterized"] }
rustev-backend-rules.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync"] }
# Node-API version 8 (spec 027, 3.13.1): Node 20, 22 and 24 provide it.
napi = { version = "=3.14.2", default-features = false, features = ["napi8", "serde-json", "async"] }
napi-derive = "=3.6.12"
serde = { workspace = true, optional = true }
# Spec 011, 3.17.1: the local semantic backend, off by default. Its synthetic
# encoder (011 3.19) is enabled with it, since a synthetic bundle constructs
# on any target (011 3.6.3); an `onnx` bundle is refused `unqualified_platform`
# until a platform is qualified. The runtime is loaded dynamically, so the
# binding with the feature links with no ONNX Runtime present.
rustev-backend-embed-linear = { path = "../../backends/rustev-backend-embed-linear", optional = true, features = ["synthetic"] }

[features]
# Spec 011, 3.17.1. The prebuilt platform packages are built without it
# (011 Decision 10); a host enables it by building from source.
local-embed = ["dep:rustev-backend-embed-linear", "dep:serde"]

[build-dependencies]
napi-build = "=2.6.0"

# Spec 027, 3.14: napi-rs's macro-generated glue uses `unsafe` (registration
# and value conversion), so this crate relaxes the workspace's `forbid` to
# `deny`, which the generated code's own `allow` can lift; hand-written code
# stays without `unsafe`, and `tests/no_unsafe.rs` fails on any.
# Cargo cannot inherit the workspace's lints and override one, so they are
# restated here; today the workspace has only `unsafe_code`, and any lint
# it gains is to be mirrored in this table too.
[lints.rust]
unsafe_code = "deny"
