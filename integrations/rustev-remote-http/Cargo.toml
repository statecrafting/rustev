[package]
name = "rustev-remote-http"
version.workspace = true
description = "Rustev's remote adapter machinery and the rustev.remote/1 HTTP binding: a client implementing the backend seam and a server hosting any backend."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rustev-remote-http"
readme.workspace = true
keywords = ["decision-engine", "http", "protocol"]
categories = ["network-programming"]
# Spec 021, 3.4: the intended public registry only.
publish = ["crates-io"]
# Spec 021, 3.5: the archive holds the library source; the reviewed file list
# is tools/rustev-release/archive-policy.json.
include = ["/src/**/*.rs", "/LICENSE"]

[package.metadata.spec-spine]
spec = "009-remote-adapter-protocol"

[dependencies]
rustev-contract.workspace = true
rustev-core = { workspace = true, features = ["parameterized"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["net", "time", "rt", "sync", "macros", "io-util"] }
hyper = { workspace = true, features = ["client", "server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true

# The runtime, eval and the rules backend are for the conformance suite only.
[dev-dependencies]
rustev-runtime.workspace = true
rustev-eval = { workspace = true, features = ["parameterized"] }
rustev-backend-rules.workspace = true
tokio = { workspace = true, features = ["net", "time", "rt", "rt-multi-thread", "sync", "macros", "io-util", "test-util"] }

[lints]
workspace = true
