[package]
name = "rustev-pkg-lodging"
version = "0.1.0"
description = "Rustev reference package: lodging recommendation definition and SYNTHETIC mechanics material."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.spec-spine]
spec = "008-reference-package-lodging"

# Contract and core only (spec 008 section 2); `make boundaries` enforces it.
[dependencies]
rustev-contract = { path = "../../crates/rustev-contract" }
rustev-core = { path = "../../crates/rustev-core" }

[dev-dependencies]
rustev-runtime = { path = "../../crates/rustev-runtime" }
rustev-eval = { path = "../../crates/rustev-eval" }
rustev-cli = { path = "../../crates/rustev-cli" }
rustev-backend-rules = { path = "../../backends/rustev-backend-rules" }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }

[lints]
workspace = true
