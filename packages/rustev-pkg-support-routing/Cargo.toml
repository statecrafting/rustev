[package]
name = "rustev-pkg-support-routing"
version.workspace = true
description = "Rustev reference package: the support-routing decision definition, its evaluation material and a SYNTHETIC dataset."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rustev-pkg-support-routing"
readme.workspace = true
keywords = ["decision-engine", "example", "synthetic"]
categories = ["algorithms"]
# Spec 021, 3.4: the intended public registry only.
publish = ["crates-io"]

[package.metadata.spec-spine]
spec = "007-support-routing-package"

# Contract and core only (spec 007 3.3.1); `make boundaries` enforces it.
[dependencies]
rustev-contract.workspace = true
rustev-core.workspace = true

# The runtime, a backend, eval and the CLI run the package's own tests only.
[dev-dependencies]
rustev-runtime.workspace = true
rustev-eval.workspace = true
rustev-cli.workspace = true
rustev-backend-rules.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }

[lints]
workspace = true
